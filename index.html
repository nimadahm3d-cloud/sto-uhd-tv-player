<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STO People's Choice | UHD Display</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}#stage,video{position:absolute;inset:0;width:100%;height:100%;background:#000}video{object-fit:contain;opacity:0;transition:opacity .5s}video.active{opacity:1}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:5}#panel{max-width:550px;padding:28px;background:#141923;border:1px solid #384153;border-radius:18px;text-align:center}h1{font-size:25px;margin:0 0 8px}p{line-height:1.5;color:#bac5d6}button{border:0;border-radius:10px;padding:14px 22px;font-size:17px;font-weight:bold;background:#e52735;color:#fff;cursor:pointer}#status{position:absolute;bottom:16px;left:16px;background:#0009;color:#eee;padding:7px 10px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}#status.show{opacity:1}#error{color:#ffb5b5;font-size:14px;min-height:20px}#hint{font-size:12px}#start{display:none}
</style></head><body><div id="stage"><video id="v0" playsinline webkit-playsinline muted preload="auto"></video><video id="v1" playsinline webkit-playsinline muted preload="auto"></video></div><div id="overlay"><div id="panel"><h1>STO People's Choice</h1><p>Store UHD Video Display</p><p id="message">Loading video playlist…</p><button id="start">Start display</button><p id="error"></p><p id="hint">For best results, open this page in your TV's built-in browser and select full screen.</p></div></div><div id="status"></div>
<script>
'use strict';
const params=new URLSearchParams(location.search);const configUrl=params.get('playlist')||'playlist.json';const overlay=document.getElementById('overlay'),start=document.getElementById('start'),message=document.getElementById('message'),error=document.getElementById('error'),status=document.getElementById('status');const videos=[document.getElementById('v0'),document.getElementById('v1')];let config,items=[],index=0,active=0,started=false,loading=false,failed=0,refreshTimer=null,lastConfig='';
function notice(t){status.textContent=t;status.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>status.classList.remove('show'),3500)}
function showStart(msg){message.textContent=msg;overlay.style.display='flex';start.style.display='inline-block'}
function safeUrl(url){const s=String(url||'').trim();if(!s||/^javascript:/i.test(s))return null;return s}
async function fetchConfig(){const r=await fetch(configUrl+(configUrl.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Playlist HTTP '+r.status);const c=await r.json();if(!Array.isArray(c.videos)||!c.videos.length)throw Error('No videos in playlist.json');const valid=c.videos.filter(x=>x&&safeUrl(x.src)).map(x=>({src:safeUrl(x.src),title:x.title||'Video'}));if(!valid.length)throw Error('Playlist contains no valid video URLs');return {...c,videos:valid}}
function applyConfig(c){const signature=JSON.stringify(c.videos);config=c;items=c.videos;videos.forEach(v=>{v.muted=true;v.volume=0;v.style.objectFit=c.fit==='cover'?'cover':'contain'});if(lastConfig&&signature!==lastConfig){index=0;playIndex(0)}lastConfig=signature}
function source(i){return items[(i+items.length)%items.length]}
function prepare(slot,i){const v=videos[slot],s=source(i);if(!s)return;v.dataset.src=s.src;if(v.getAttribute('src')!==s.src){v.src=s.src;v.load()}}
async function playIndex(i){if(!items.length||loading)return;loading=true;index=(i+items.length)%items.length;const next=1-active,old=videos[active],v=videos[next];prepare(next,index);v.muted=true;v.currentTime=0;try{await v.play();v.classList.add('active');old.classList.remove('active');active=next;setTimeout(()=>{old.pause();old.removeAttribute('src');old.load();prepare(1-active,index+1)},550);failed=0;overlay.style.display='none';started=true;notice(source(index).title)}catch(e){if(e.name==='NotAllowedError'){showStart('Your TV requires one click to begin playback.');error.textContent='';}else{failed++;error.textContent='Could not play '+source(index).title+': '+e.message; if(failed<items.length){setTimeout(()=>{loading=false;playIndex(index+1)},1200)}else{showStart('No videos could be played. Check the video URLs and codec (MP4 H.264/HEVC).')}}}finally{loading=false}}
function begin(){error.textContent='';start.style.display='none';playIndex(index)}
videos.forEach((v,slot)=>{v.addEventListener('ended',()=>{if(slot===active)playIndex(index+1)});v.addEventListener('error',()=>{if(slot!==active||!started)return;notice('Video unavailable; trying next');setTimeout(()=>playIndex(index+1),800)});});start.addEventListener('click',begin);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')playIndex(index+1);if(e.key==='ArrowLeft')playIndex(index-1);if(e.key==='Enter'&&overlay.style.display!=='none')begin();if(e.key.toLowerCase()==='f'&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})});
(async()=>{try{applyConfig(await fetchConfig());message.textContent='Starting playback…';start.style.display='inline-block';begin();const seconds=Math.max(30,Number(config.refreshSeconds)||120);refreshTimer=setInterval(async()=>{try{applyConfig(await fetchConfig())}catch(e){console.warn('Playlist refresh failed',e)}},seconds*1000)}catch(e){showStart('Unable to load playlist.');error.textContent=e.message+' — host the folder on a web server (not file://).'}})();
</script></body></html>
