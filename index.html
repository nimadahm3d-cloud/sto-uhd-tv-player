<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STO People's Choice | UHD Display</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);text-align:center;padding:24px}#ui.hidden{display:none}.panel{max-width:600px}h1{font-size:clamp(24px,4vw,44px);margin:0 0 12px}p{line-height:1.5;color:#ccc}button{background:#fff;color:#000;border:0;border-radius:8px;padding:16px 28px;font-weight:bold;font-size:18px;cursor:pointer}#status{font-size:14px;margin-top:18px;white-space:pre-wrap}#hint{position:absolute;bottom:12px;left:16px;color:#ddd;font-size:12px;opacity:0;transition:opacity .2s}body:hover #hint{opacity:.8}</style></head><body><video id="screen" muted autoplay playsinline preload="auto"></video><div id="ui"><div class="panel"><h1>STO PEOPLE'S CHOICE</h1><p>UHD Showroom Video Display</p><button id="start">Start Display</button><p id="status">Loading playlist…</p></div></div><div id="hint">Press Enter to restart • Esc to leave fullscreen</div><script>
(function(){'use strict';var video=document.getElementById('screen'),ui=document.getElementById('ui'),status=document.getElementById('status'),button=document.getElementById('start');var items=[],index=0,attempts=0,started=false,loading=false;var MAX_RETRIES=2;function say(s){status.textContent=s}function listOf(data){var raw=Array.isArray(data)?data:(data&&Array.isArray(data.videos)?data.videos:[]);return raw.map(function(v){if(typeof v==='string')return {src:v,title:''};if(v&&typeof v==='object')return {src:v.src||v.url||'',title:v.title||''};return {src:''}}).filter(function(v){return /^https?:\/\//i.test(v.src)||/^\.\.?\//.test(v.src)||/^videos\//.test(v.src)});}function next(){if(!items.length)return;index=(index+1)%items.length;attempts=0;playCurrent()}function fail(reason){attempts++;if(attempts<=MAX_RETRIES){say('Retrying video '+(index+1)+'…');setTimeout(playCurrent,1200);return}if(items.length>1){say('Skipping unavailable video…');setTimeout(next,500)}else{ui.classList.remove('hidden');say(reason+'\nCheck the video link or try another MP4.')}}function playCurrent(){if(!items.length)return;loading=true;video.pause();video.removeAttribute('src');video.load();video.src=items[index].src;video.muted=true;video.load();var p;try{p=video.play()}catch(e){fail('Playback failed');return}if(p&&p.then)p.then(function(){started=true;loading=false;ui.classList.add('hidden')}).catch(function(e){loading=false;ui.classList.remove('hidden');say('Playback blocked or unsupported. Select Start Display. '+(e&&e.message||''))});}function begin(){if(!items.length){say('No playable video URLs in playlist.json');return}attempts=0;playCurrent();if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(function(){})}}button.addEventListener('click',begin);video.addEventListener('ended',next);video.addEventListener('error',function(){if(loading||started)fail('Video could not be loaded or decoded.')});document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!ui.classList.contains('hidden'))begin();});function refresh(){fetch('playlist.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){var found=listOf(data);if(!found.length)throw new Error('No valid src URLs in playlist.json');var old=JSON.stringify(items);items=found;if(!started){say('Ready: '+items.length+' video(s)');playCurrent()}else if(JSON.stringify(items)!==old){index=0;attempts=0;playCurrent()}}).catch(function(e){if(!items.length){say('Unable to load playlist: '+e.message+'\nCheck that playlist.json is beside index.html.')}})}refresh();setInterval(refresh,120000);})();
</script></body></html>
